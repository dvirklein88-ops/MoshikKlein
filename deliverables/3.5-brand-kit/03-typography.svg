<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="760" viewBox="0 0 1200 760"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#F3EEE8"/><text x="1140" y="80" font-family="Rubik, Heebo, Arial, sans-serif" font-size="48" font-weight="600" fill="#1E1A16" text-anchor="start" direction="rtl" letter-spacing="0">טיפוגרפיה</text><text x="1140" y="200" font-family="Heebo, Arial, sans-serif" font-size="26" font-weight="500" fill="#5A5047" text-anchor="start" direction="rtl" letter-spacing="0">Rubik · כותרות</text><text x="1140" y="290" font-family="Rubik, Heebo, Arial, sans-serif" font-size="80" font-weight="600" fill="#1E1A16" text-anchor="start" direction="rtl" letter-spacing="-1">הכי טוב שנדבר על זה</text><text x="1140" y="340" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="400" fill="#5A5047" text-anchor="start" direction="rtl" letter-spacing="0">משקלים 500–700 · ריווח צפוף · כותרות קצרות</text><rect x="60" y="380" width="1080" height="2" rx="0" fill="#CBBFB5"/><text x="1140" y="450" font-family="Heebo, Arial, sans-serif" font-size="26" font-weight="500" fill="#5A5047" text-anchor="start" direction="rtl" letter-spacing="0">Heebo · טקסט</text><text x="1140" y="510" font-family="Heebo, Arial, sans-serif" font-size="30" font-weight="400" fill="#1E1A16" text-anchor="start" direction="rtl" letter-spacing="0">ליווי חם שמכבד את הבית שלכם, את הקצב של הילד ואת המסורת של המשפחה.</text><text x="1140" y="556" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="400" fill="#5A5047" text-anchor="start" direction="rtl" letter-spacing="0">גוף טקסט 17px באתר, גובה שורה 1.65. משפטים קצרים, גוף ראשון: מושיק פונה להורה.</text><rect x="60" y="600" width="1080" height="2" rx="0" fill="#CBBFB5"/><text x="1140" y="670" font-family="Heebo, Arial, sans-serif" font-size="28" font-weight="500" fill="#1E1A16" text-anchor="start" direction="rtl" letter-spacing="0">קול: חם · רגוע · קצר · בלי הטפה · בלי מחירים · "בקצב של הילד"</text><text x="1140" y="715" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="400" fill="#5A5047" text-anchor="start" direction="rtl" letter-spacing="0">שני הגופנים חינמיים ב-Google Fonts ותומכים בעברית.</text></svg>